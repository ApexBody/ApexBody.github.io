<!DOCTYPE html>
<html lang="zxx" class="no-js">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" href="img/fav.png">
    <meta name="author" content="CodePixar">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta charset="UTF-8">
    <title>Student Kit</title>
    
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,300,500,600" rel="stylesheet">
    
    <link rel="stylesheet" href="css/linearicons.css">
    <link rel="stylesheet" href="css/owl.carousel.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/nice-select.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }
        .main-wrapper-first {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .banner-content {
            text-align: center;
            padding: 40px 0;
        }
        .banner-content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .back-btn {
            background-color: #5e39e5;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 20px 0;
        }
        .back-btn:hover {
            background-color: #4a2bb8;
        }
        .about-generic-area {
            padding: 80px 0;
            background-color: #fcfcfc;
            min-height: 50vh;
        }
        
        /* TBA Card Styles */
        .tba-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 600px;
            margin: 0 auto;
            border-top: 6px solid #5e39e5;
            transition: transform 0.3s ease;
        }
        .tba-card:hover {
            transform: translateY(-5px);
        }
        .tba-card i {
            font-size: 5rem;
            color: #c1acfc;
            margin-bottom: 25px;
            display: block;
        }
        .tba-card h2 {
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .tba-card p {
            font-size: 1.1rem;
            color: #666;
            margin: 0;
            line-height: 1.6;
        }

        .footer-area {
            background-color: #333;
            color: white;
            padding: 30px 0;
            text-align: center;
        }
        .footer-menu {
            margin-bottom: 20px;
        }
        .footer-menu a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }
        .footer-menu a:hover {
            color: #c1acfc;
        }
    </style>
</head>
<body>
    <div class="main-wrapper-first">
        <div class="hero-area genric-banner relative">
            <header>
                <div class="container">
                    <div class="header-wrap">
                        <div class="header-top">
                            <div class="logo">
                                <a href="index.html"><img src="img/iiit-logo-2.png" alt="" width="22%"></a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            <div class="banner-area">
                <div class="container">
                    <div class="row height align-items-center justify-content-center">
                        <div class="col-lg-9">
                            <div class="banner-content">
                                <h1>Induction Schedule</h1>
                            </div>
                            <div style="margin: 20px; text-align: center;">
                                <button onclick="history.back()" class="back-btn">← Back</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-wrapper px-0">
        <section class="about-generic-area">
            <div class="container border-top-generic px-0">
                
                <div class="tba-card">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                    <h2>To Be Announced</h2>
                    <p>The induction schedule for the upcoming academic year is currently being finalized. Please check back later for the complete itinerary.</p>
                </div>

            </div>
        </section>
        </div>

    <footer class="footer-area relative">
        <div class="container">
            <div class="footer-content d-flex flex-column align-items-center">
                <div class="footer-menu">
                    <a href="https://www.linkedin.com/company/apex-iiit-hyderabad">LinkedIn</a>
                    <a href="index.html">Home</a>
                    <a href="index.html#shift">The Kit</a>
                    <a href="https://www.iiit.ac.in/">IIITH</a>
                </div>
                <div class="copy-right-text">Student Kit 2026-27 | Created by Apex '26</div>
            </div>
        </div>
    </footer>

    <script src="js/vendor/jquery-2.2.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js" integrity="sha384-b/U6ypiBEHpOf/4+1nzFpr53nxSS+GLCkfwBdFNTxtclqqenISfwAzpKaMNFNmj4" crossorigin="anonymous"></script>
    <script src="js/vendor/bootstrap.min.js"></script>
    <script src="js/jquery.ajaxchimp.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/jquery.nice-select.min.js"></script>
    <script src="js/parallax.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
